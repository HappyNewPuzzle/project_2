# GitHub Actions 화면에 표시될 워크플로 이름입니다.
name: Backend CI

# 이 워크플로가 언제 실행될지 정합니다.
on:
  # main 브랜치로 push할 때 자동 검증합니다.
  push:
    # 현재 기본 브랜치만 대상으로 삼아 불필요한 실행을 줄입니다.
    branches: ["main"]
    # 백엔드나 이 워크플로가 바뀔 때만 실행합니다.
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  # Pull Request를 만들거나 업데이트할 때도 같은 검증을 수행합니다.
  pull_request:
    # main으로 합쳐질 PR만 확인합니다.
    branches: ["main"]
    # 백엔드와 CI 설정 변경만 대상으로 합니다.
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  # GitHub Actions 화면에서 수동으로 다시 실행할 수 있게 합니다.
  workflow_dispatch:

# 같은 브랜치에서 새 실행이 시작되면 오래된 실행을 취소합니다.
concurrency:
  # 워크플로 이름과 브랜치/PR 기준으로 실행 그룹을 나눕니다.
  group: backend-ci-${{ github.ref }}
  # 최신 커밋 결과만 중요하므로 이전 실행을 취소합니다.
  cancel-in-progress: true

# CI가 저장소 코드를 읽는 데 필요한 최소 권한만 줍니다.
permissions:
  # actions/checkout이 코드를 가져올 수 있게 읽기 권한을 부여합니다.
  contents: read

# 실제 검증 작업 목록입니다.
jobs:
  # Python 단위/API 테스트를 실행하는 작업입니다.
  test:
    # GitHub가 제공하는 Ubuntu 실행 환경을 사용합니다.
    runs-on: ubuntu-latest

    # 모든 run 명령은 backend 디렉터리에서 실행됩니다.
    defaults:
      run:
        working-directory: backend

    # 테스트 실행에 필요한 환경 변수입니다.
    env:
      # 테스트용 JWT secret입니다. 운영 secret이 아니며 GitHub Secrets를 쓰지 않습니다.
      JWT_SECRET_KEY: ci-test-secret-key-change-me
      # 실제 DB 접속 테스트가 아니어도 설정 객체 생성에 필요한 기본값입니다.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/character_chat
      # 테스트는 LLM 의존성을 가짜 객체로 교체하므로 실제 API 키가 필요 없습니다.
      OPENAI_API_KEY: ""
      # CI 로그는 사람이 읽기 쉬운 일반 텍스트로 출력합니다.
      LOG_JSON: "false"

    # 작업 안에서 순서대로 실행할 단계입니다.
    steps:
      # 저장소 코드를 runner로 가져옵니다.
      - name: Check out repository
        uses: actions/checkout@v6

      # 프로젝트와 Dockerfile에서 사용하는 Python 3.12를 설치합니다.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Dockerfile과 맞춰 테스트 Python 버전을 고정합니다.
          python-version: "3.12"
          # pip 다운로드 캐시를 사용해 반복 실행 속도를 높입니다.
          cache: "pip"
          # requirements.txt가 바뀌면 캐시도 새로 계산합니다.
          cache-dependency-path: backend/requirements.txt

      # pip 자체를 먼저 최신화합니다.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 백엔드 실행과 테스트에 필요한 패키지를 설치합니다.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # pytest로 현재 테스트 스위트를 실행합니다.
      - name: Run tests
        run: pytest -q

  # Dockerfile이 실제로 빌드 가능한지 확인하는 작업입니다.
  docker-build:
    # Python 테스트가 성공한 뒤에만 Docker 빌드를 진행합니다.
    needs: test
    # Docker가 기본 제공되는 Ubuntu 실행 환경을 사용합니다.
    runs-on: ubuntu-latest

    # Docker 빌드는 backend 디렉터리를 기준으로 실행합니다.
    defaults:
      run:
        working-directory: backend

    # Docker 빌드 단계 목록입니다.
    steps:
      # Dockerfile과 앱 코드를 가져옵니다.
      - name: Check out repository
        uses: actions/checkout@v6

      # 배포는 하지 않고 이미지가 정상 빌드되는지만 확인합니다.
      - name: Build backend image
        run: docker build --tag ai-character-chat-backend:ci .
