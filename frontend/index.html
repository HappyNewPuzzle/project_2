<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Character Chat</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #111827;
        color: #e5e7eb;
      }

      main {
        width: min(1100px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }

      p {
        color: #9ca3af;
        line-height: 1.6;
      }

      .layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 16px;
      }

      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      section {
        border: 1px solid #374151;
        border-radius: 16px;
        background: #1f2937;
        padding: 16px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      label {
        display: grid;
        gap: 6px;
        margin: 10px 0;
        color: #d1d5db;
        font-size: 14px;
      }

      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #4b5563;
        border-radius: 10px;
        background: #111827;
        color: #f9fafb;
        padding: 10px;
        font: inherit;
      }

      textarea {
        min-height: 80px;
        resize: vertical;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: #60a5fa;
        color: #0f172a;
        cursor: pointer;
        font-weight: 700;
        padding: 10px 14px;
      }

      button.secondary {
        background: #9ca3af;
      }

      .conversation-list {
        display: grid;
        gap: 8px;
        max-height: 220px;
        overflow-y: auto;
      }

      .conversation-item {
        border: 1px solid #4b5563;
        border-radius: 12px;
        background: #111827;
        color: #e5e7eb;
        display: grid;
        gap: 4px;
        padding: 10px;
        text-align: left;
      }

      .conversation-item.active {
        border-color: #60a5fa;
      }

      .conversation-meta {
        color: #9ca3af;
        font-size: 12px;
      }

      #messages {
        display: grid;
        gap: 10px;
        min-height: 420px;
        max-height: 620px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .message {
        border-radius: 14px;
        padding: 12px;
        white-space: pre-wrap;
      }

      .user {
        background: #1d4ed8;
      }

      .assistant {
        background: #374151;
      }

      #status {
        min-height: 24px;
        color: #fbbf24;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>AI Character Chat</h1>
        <p>
          FastAPI 백엔드와 연결하는 최소 프론트엔드입니다. 회원가입/로그인 후
          캐릭터를 만들고 스트리밍 채팅을 테스트할 수 있습니다.
        </p>
      </header>

      <div class="layout">
        <section>
          <h2>1. 연결 / 인증</h2>
          <label>
            API Base URL
            <input id="apiBaseUrl" value="http://127.0.0.1:8000" />
          </label>
          <label>
            Email
            <input id="email" value="learner@example.com" />
          </label>
          <label>
            Password
            <input id="password" type="password" value="strong-password" />
          </label>
          <div class="actions">
            <button id="registerButton">회원가입</button>
            <button id="loginButton">로그인</button>
          </div>

          <h2>2. 캐릭터</h2>
          <label>
            이름
            <input id="characterName" value="루나" />
          </label>
          <label>
            설명
            <textarea id="characterDescription">달빛 도서관의 사서</textarea>
          </label>
          <label>
            말투
            <textarea id="speakingStyle">부드럽고 간결하게 말한다</textarea>
          </label>
          <div class="actions">
            <button id="createCharacterButton">캐릭터 생성</button>
            <button id="saveMemoryButton" class="secondary">기억 저장</button>
          </div>

          <h2>3. 대화 목록</h2>
          <div class="actions">
            <button id="loadConversationsButton" class="secondary">목록 새로고침</button>
            <button id="deleteConversationButton" class="secondary">현재 대화 삭제</button>
          </div>
          <div id="conversationList" class="conversation-list"></div>

          <p id="status"></p>
        </section>

        <section>
          <h2>4. 스트리밍 채팅</h2>
          <div id="messages"></div>
          <label>
            메시지
            <textarea id="chatMessage">안녕! 너를 소개해줘.</textarea>
          </label>
          <div class="actions">
            <button id="sendButton">스트리밍 전송</button>
            <button id="resetConversationButton" class="secondary">새 대화</button>
          </div>
        </section>
      </div>
    </main>

    <script>
      // 자주 쓰는 DOM 요소를 한 번만 찾아 보관합니다.
      const elements = {
        apiBaseUrl: document.querySelector("#apiBaseUrl"),
        email: document.querySelector("#email"),
        password: document.querySelector("#password"),
        characterName: document.querySelector("#characterName"),
        characterDescription: document.querySelector("#characterDescription"),
        speakingStyle: document.querySelector("#speakingStyle"),
        chatMessage: document.querySelector("#chatMessage"),
        messages: document.querySelector("#messages"),
        status: document.querySelector("#status"),
        registerButton: document.querySelector("#registerButton"),
        loginButton: document.querySelector("#loginButton"),
        createCharacterButton: document.querySelector("#createCharacterButton"),
        saveMemoryButton: document.querySelector("#saveMemoryButton"),
        loadConversationsButton: document.querySelector("#loadConversationsButton"),
        deleteConversationButton: document.querySelector("#deleteConversationButton"),
        conversationList: document.querySelector("#conversationList"),
        sendButton: document.querySelector("#sendButton"),
        resetConversationButton: document.querySelector("#resetConversationButton"),
      };

      // 새로고침 후에도 토큰과 선택한 캐릭터를 유지하기 위해 localStorage를 사용합니다.
      const state = {
        token: localStorage.getItem("token") || "",
        characterId: localStorage.getItem("characterId") || "",
        conversationId: localStorage.getItem("conversationId") || "",
      };

      // 화면 아래 상태 문구를 바꿉니다.
      function setStatus(message) {
        elements.status.textContent = message;
      }

      // API URL의 끝 슬래시를 제거해 경로 조합을 단순하게 만듭니다.
      function apiBaseUrl() {
        return elements.apiBaseUrl.value.replace(/\/$/, "");
      }

      // 인증이 필요한 요청에 붙일 Authorization 헤더를 만듭니다.
      function authHeaders(extra = {}) {
        return {
          ...extra,
          Authorization: `Bearer ${state.token}`,
        };
      }

      // 채팅 영역에 새 말풍선을 추가합니다.
      function addMessage(role, content = "") {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        node.textContent = content;
        elements.messages.appendChild(node);
        elements.messages.scrollTop = elements.messages.scrollHeight;
        return node;
      }

      // 서버에서 읽어 온 메시지 배열로 채팅 화면을 다시 그립니다.
      function renderMessages(messages) {
        elements.messages.innerHTML = "";
        for (const message of messages) {
          addMessage(message.role, message.content);
        }
      }

      // JSON API 응답이 실패했을 때 사람이 읽기 쉬운 오류를 만듭니다.
      async function ensureOk(response) {
        if (response.ok) {
          return response;
        }
        const text = await response.text();
        throw new Error(`${response.status} ${response.statusText}: ${text}`);
      }

      // 회원가입 API를 호출합니다.
      async function register() {
        const response = await fetch(`${apiBaseUrl()}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: elements.email.value,
            password: elements.password.value,
          }),
        });
        await ensureOk(response);
        setStatus("회원가입 완료. 이제 로그인하세요.");
      }

      // 로그인 후 access token을 localStorage에 저장합니다.
      async function login() {
        const form = new URLSearchParams();
        form.set("username", elements.email.value);
        form.set("password", elements.password.value);

        const response = await fetch(`${apiBaseUrl()}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: form,
        });
        await ensureOk(response);
        const body = await response.json();
        state.token = body.access_token;
        localStorage.setItem("token", state.token);
        setStatus("로그인 완료.");
      }

      // 캐릭터 생성 API를 호출하고 선택 캐릭터로 저장합니다.
      async function createCharacter() {
        const response = await fetch(`${apiBaseUrl()}/characters`, {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({
            name: elements.characterName.value,
            description: elements.characterDescription.value,
            speaking_style: elements.speakingStyle.value,
          }),
        });
        await ensureOk(response);
        const body = await response.json();
        state.characterId = body.id;
        localStorage.setItem("characterId", state.characterId);
        setStatus(`캐릭터 생성 완료: ${body.name}`);
      }

      // 현재 캐릭터에 연결할 간단한 장기 기억을 저장합니다.
      async function saveMemory() {
        const response = await fetch(`${apiBaseUrl()}/memories`, {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({
            content: "사용자는 웹 프론트엔드에서 테스트 중이다",
            character_id: state.characterId || null,
            importance: 3,
          }),
        });
        await ensureOk(response);
        setStatus("장기 기억 저장 완료.");
      }

      // 대화 목록을 서버에서 읽어와 버튼 목록으로 표시합니다.
      async function loadConversations() {
        const response = await fetch(`${apiBaseUrl()}/conversations`, {
          headers: authHeaders(),
        });
        await ensureOk(response);
        const conversations = await response.json();
        elements.conversationList.innerHTML = "";

        for (const conversation of conversations) {
          const button = document.createElement("button");
          button.className = "conversation-item";
          if (conversation.id === state.conversationId) {
            button.classList.add("active");
          }
          button.innerHTML = `
            <span>${conversation.id}</span>
            <span class="conversation-meta">updated: ${conversation.updated_at}</span>
          `;
          button.addEventListener("click", () => openConversation(conversation));
          elements.conversationList.appendChild(button);
        }
        setStatus(`대화 ${conversations.length}개를 불러왔습니다.`);
      }

      // 선택한 대화방의 메시지를 읽어 화면에 복원합니다.
      async function openConversation(conversation) {
        const response = await fetch(
          `${apiBaseUrl()}/conversations/${conversation.id}/messages`,
          { headers: authHeaders() },
        );
        await ensureOk(response);
        const messages = await response.json();
        state.conversationId = conversation.id;
        state.characterId = conversation.character_id;
        localStorage.setItem("conversationId", state.conversationId);
        localStorage.setItem("characterId", state.characterId);
        renderMessages(messages);
        await loadConversations();
        setStatus("이전 대화를 열었습니다.");
      }

      // 현재 선택된 대화방을 삭제하고 화면 상태를 새 대화로 초기화합니다.
      async function deleteCurrentConversation() {
        if (!state.conversationId) {
          setStatus("삭제할 현재 대화가 없습니다.");
          return;
        }
        const response = await fetch(
          `${apiBaseUrl()}/conversations/${state.conversationId}`,
          {
            method: "DELETE",
            headers: authHeaders(),
          },
        );
        await ensureOk(response);
        elements.messages.innerHTML = "";
        resetConversation();
        await loadConversations();
        setStatus("현재 대화를 삭제했습니다.");
      }

      // SSE 한 이벤트 블록을 event 이름과 data 문자열로 나눕니다.
      function parseSseBlock(block) {
        const eventLine = block.split("\n").find((line) => line.startsWith("event: "));
        const dataLine = block.split("\n").find((line) => line.startsWith("data: "));
        return {
          event: eventLine ? eventLine.slice("event: ".length) : "message",
          data: dataLine ? JSON.parse(dataLine.slice("data: ".length)) : {},
        };
      }

      // POST 기반 SSE 스트림을 fetch ReadableStream으로 읽습니다.
      async function sendStreamingMessage() {
        const message = elements.chatMessage.value.trim();
        if (!message) {
          setStatus("메시지를 입력하세요.");
          return;
        }

        addMessage("user", message);
        const assistantNode = addMessage("assistant", "");
        setStatus("AI 응답을 스트리밍 중입니다...");

        const payload = {
          message,
          character_id: state.conversationId ? undefined : state.characterId || undefined,
          conversation_id: state.conversationId || undefined,
        };

        const response = await fetch(`${apiBaseUrl()}/chat/stream`, {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify(payload),
        });
        await ensureOk(response);

        const decoder = new TextDecoder();
        const reader = response.body.getReader();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            break;
          }
          buffer += decoder.decode(value, { stream: true });

          const blocks = buffer.split("\n\n");
          buffer = blocks.pop() || "";

          for (const block of blocks) {
            if (!block.trim()) {
              continue;
            }
            const event = parseSseBlock(block);
            if (event.event === "conversation") {
              state.conversationId = event.data.conversation_id;
              state.characterId = event.data.character_id;
              localStorage.setItem("conversationId", state.conversationId);
              localStorage.setItem("characterId", state.characterId);
            }
            if (event.event === "token") {
              assistantNode.textContent += event.data.delta;
            }
            if (event.event === "error") {
              throw new Error(event.data.message || "Streaming error");
            }
            if (event.event === "done") {
              setStatus("응답 완료.");
              await loadConversations();
            }
          }
        }
      }

      // 현재 conversation_id를 지워 다음 메시지를 새 대화로 시작합니다.
      function resetConversation() {
        state.conversationId = "";
        localStorage.removeItem("conversationId");
        setStatus("새 대화로 전환했습니다.");
      }

      // 버튼 클릭 시 비동기 함수 오류를 한 곳에서 처리합니다.
      function bind(button, handler) {
        button.addEventListener("click", async () => {
          try {
            await handler();
          } catch (error) {
            setStatus(error.message);
          }
        });
      }

      // 각 버튼에 실제 동작을 연결합니다.
      bind(elements.registerButton, register);
      bind(elements.loginButton, login);
      bind(elements.createCharacterButton, createCharacter);
      bind(elements.saveMemoryButton, saveMemory);
      bind(elements.loadConversationsButton, loadConversations);
      bind(elements.deleteConversationButton, deleteCurrentConversation);
      bind(elements.sendButton, sendStreamingMessage);
      bind(elements.resetConversationButton, resetConversation);

      // 초기 상태를 사용자에게 알려줍니다.
      setStatus(state.token ? "저장된 토큰이 있습니다." : "먼저 회원가입 또는 로그인하세요.");
    </script>
  </body>
</html>
